name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin --ignore-version-mismatches'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin --ignore-version-mismatches'
          - platform: 'windows-latest'
            target: ''
            args: '--ignore-version-mismatches'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'R2 Manager ${{ github.ref_name }}'
          releaseBody: |
            ### 安装包下载指南 (Assets)

            | 操作系统 / 架构 | 推荐安装包 | 适用机型 |
            | :--- | :--- | :--- |
            | **macOS (Apple Silicon)** | `*aarch64.dmg` | 适用于 Apple M1 / M2 / M3 / M4 芯片 |
            | **macOS (Intel)** | `*x64.dmg` | 适用于 Intel 处理器款 Mac |
            | **Windows (64-bit)** | `*x64-setup.exe` | 适用于 Windows 10 / 11 |

            > **macOS 安装提示**：由于未购买商业开发者证书，首次打开若提示“无法验证开发者”，请前往系统「设置 -> 隐私与安全性」底部点击「仍要打开」即可正常使用。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
