[package]
name = "r2manager"
version = "0.1.0"
description = "Cloudflare R2 desktop manager"
authors = ["you"]
edition = "2021"
rust-version = "1.88"
resolver = "3"

[lib]
name = "r2manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest", "rt-tokio"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
walkdir = "2"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
